<main class="container py-5">
  <h1 class="mb-1">ngx-modalieur</h1>
  <p class="text-body-secondary mb-4">Bootstrap-styled modals over Angular CDK Dialog, with reactive results.</p>

  <div class="d-flex flex-wrap gap-2 mb-4">
    <button type="button" class="btn btn-primary" (click)="openConfirm()">Confirm (Yes / No)</button>
    <button type="button" class="btn btn-outline-primary" (click)="openLarge()">Large size</button>
    <button type="button" class="btn btn-outline-primary" (click)="openStatic()">Non-dismissible</button>
    <button type="button" class="btn btn-outline-primary" (click)="openWaiting()">Auto-close (showUntil)</button>
    <button type="button" class="btn btn-outline-primary" (click)="openNamePrompt()">Returns data</button>
  </div>

  <div class="alert alert-secondary mb-0" role="status">
    <strong>Last outcome:</strong> {{ lastOutcome() }}
  </div>
</main>
