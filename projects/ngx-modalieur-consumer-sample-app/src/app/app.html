<main class="container py-5">
  <h1 class="mb-1">ngx-modalieur</h1>
  <p class="text-body-secondary mb-4">Bootstrap-styled modals over Angular CDK Dialog, with reactive results.</p>

  <div class="alert alert-secondary" role="status"><strong>Last outcome:</strong> {{ lastOutcome() }}</div>

  <div class="row g-4">
    @for (example of examples; track example.id) {
      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <button type="button" class="btn align-self-start mb-3 {{ example.btnClass }}" (click)="example.run()">
              {{ example.label }}
            </button>
            <pre class="bg-body-tertiary border rounded p-3 mb-0 small"><code>{{ example.code }}</code></pre>
          </div>
        </div>
      </div>
    }
  </div>
</main>
